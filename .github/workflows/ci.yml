name: CI - Build, Validate

on:
  push:
    branches:
      - main
      - truemark/**
  pull_request:

jobs:
  build-and-test:
    name: Build Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install | tee build.log

      - name: Build Action
        run: pnpm build | tee -a build.log

      - name: Run TypeScript Linting
        run: pnpm lint | tee -a build.log

      - name: Package Action (NCC)
        run: pnpm package | tee -a build.log

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Build & Test Summary (Success)
        if: success()
        run: |
          echo "## ✅ Build Passed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Version: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- PNPM Version: $(pnpm -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Build completed without issues." >> $GITHUB_STEP_SUMMARY

      - name: Build & Test Summary (Failure)
        if: failure()
        run: |
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Version: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- PNPM Version: $(pnpm -v)" >> $GITHUB_STEP_SUMMARY
          echo "### 🔴 Error Logs:" >> $GITHUB_STEP_SUMMARY
          tail -n 50 build.log >> $GITHUB_STEP_SUMMARY

#  install-tools-test:
#    name: Verify Installation
#    runs-on: ${{ matrix.runner }}
#    needs: build-and-test
#    strategy:
#      matrix:
#        runner: [ ubuntu-latest, self-hosted ]

  install-tools-test:
    name: Verify Installation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Install Kubernetes Tools
        uses: ./
        with:
          tools-debug-enabled: 'true'
          helm-enabled: 'true'
          helm-version: '3.17.1'
          kubectl-enabled: 'true'
          kubectl-version: '1.32.1'
          yq-enabled: 'true'
          argocd-enabled: 'true'
          command: |
            ARGO_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            curl -sLO "https://github.com/argoproj/argo-workflows/releases/download/v3.6.4/argo-$ARGO_OS-amd64.gz"
            gunzip "argo-$ARGO_OS-amd64.gz"
            chmod +x "argo-$ARGO_OS-amd64"
            sudo mv "./argo-$ARGO_OS-amd64" /usr/local/bin/argo

      - name: Capture Install Logs
        if: always()
        run: |
          echo "## 📜 Install Logs:" > install-tools.log
          helm version --short >> install-tools.log 2>&1 || echo "Helm failed" >> install-tools.log
          kubectl version --client >> install-tools.log 2>&1 || echo "Kubectl failed" >> install-tools.log
          yq --version >> install-tools.log 2>&1 || echo "YQ failed" >> install-tools.log
          argocd version --client >> install-tools.log 2>&1 || echo "ArgoCD failed" >> install-tools.log
          argo version >> install-tools.log 2>&1 || echo "Argo failed" >> install-tools.log
          echo "## 📜 Raw Failure Logs:" >> install-tools.log
          cat install-tools.log

      - name: Install Tools Summary (Success)
        if: success()
        run: |
          echo "## ✅ Kubernetes Tools Installed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Helm Version: $(helm version --short)" >> $GITHUB_STEP_SUMMARY
          echo "- Kubectl Version: $(kubectl version --client --short)" >> $GITHUB_STEP_SUMMARY
          echo "- YQ Version: $(yq --version)" >> $GITHUB_STEP_SUMMARY
          echo "- ArgoCD Version: $(argocd version --client)" >> $GITHUB_STEP_SUMMARY

      - name: Install Tools Summary (Failure)
        if: failure()
        run: |
          echo "## ❌ Kubernetes Tools Installation Failed" >> $GITHUB_STEP_SUMMARY
          echo "### 🔴 Error Logs:" >> $GITHUB_STEP_SUMMARY
          tail -n 50 install-tools.log >> $GITHUB_STEP_SUMMARY
