name: CI - Build, Validate

on:
  push:
    branches:
      - main
      - truemark/**
  pull_request:

jobs:
  build-and-test:
    name: Build Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install

      - name: Build Action
        run: pnpm build

      - name: Run TypeScript Linting
        run: pnpm lint

      - name: Package Action (NCC)
        run: pnpm package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Build & Test Summary (Success)
        if: success()
        run: |
          echo "## ✅ Build Passed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Version: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- PNPM Version: $(pnpm -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Build and test completed without issues." >> $GITHUB_STEP_SUMMARY

      - name: Build & Test Summary (Failure)
        if: failure()
        run: |
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Version: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- PNPM Version: $(pnpm -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Check logs for detailed error messages." >> $GITHUB_STEP_SUMMARY

  install-tools-test:
    name: Verify Installation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Install Kubernetes Tools
        uses: ./
        with:
          tools-debug-enabled: 'true'
          helm-enabled: 'true'
          helm-version: '3.17.1'
          kubectl-enabled: 'true'
          kubectl-version: '1.27.0'
          yq-enabled: 'true'
          argocd-enabled: 'true'
          command: "curl -I https://www.google.com"

      - name: Verify Helm Installation
        run: helm version --short

      - name: Verify Kubectl Installation
        run: kubectl version --client

      - name: Verify YQ Installation
        run: yq --version

      - name: Verify ArgoCD CLI Installation
        run: argocd version --client

      - name: Install Tools Summary (Success)
        if: success()
        run: |
          echo "## ✅ Kubernetes Tools Installed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Helm Version: $(helm version --short)" >> $GITHUB_STEP_SUMMARY
          echo "- Kubectl Version: $(kubectl version --client --short)" >> $GITHUB_STEP_SUMMARY
          echo "- YQ Version: $(yq --version)" >> $GITHUB_STEP_SUMMARY
          echo "- ArgoCD Version: $(argocd version --client)" >> $GITHUB_STEP_SUMMARY
          echo "- Custom Command Output: curl -I https://www.google.com" >> $GITHUB_STEP_SUMMARY

      - name: Install Tools Summary (Failure)
        if: failure()
        run: |
          echo "## ❌ Kubernetes Tools Installation Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Check logs for more details." >> $GITHUB_STEP_SUMMARY
