name: CI - Build, Validate

on:
  push:
    branches:
      - main
      - truemark/**
  pull_request:

jobs:
  build-and-test:
    name: Build Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install

      - name: Build Action
        run: pnpm build

      - name: Run TypeScript Linting
        run: pnpm lint

      - name: Package Action (NCC)
        run: pnpm package

  install-tools-test:
    name: Verify Installation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kubernetes Tools
        uses: ./
        with:
          tools-debug-enabled: 'true'
          helm-enabled: 'true'
          helm-version: '3.17.1'
          kubectl-enabled: 'true'
          kubectl-version: '1.27.0'
          yq-enabled: 'true'
          argocd-enabled: 'true'
          command: "curl -I https://www.google.com"

      - name: Verify Helm Installation
        run: helm version --short

      - name: Verify Kubectl Installation
        run: kubectl version --client --short

      - name: Verify YQ Installation
        run: yq --version

      - name: Verify Argo CLI Installation
        run: argo version

      - name: Verify ArgoCD CLI Installation
        run: argocd version --client
